<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="desastres_naturales">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>desastres_naturales</title>
  <link rel="manifest" href="manifest.json">
</head>

<script>
  window.mostrarNotificacionSistema = async function (titulo, cuerpo) {
    try {
      if (!("Notification" in window)) {
        throw new Error("Este navegador no soporta notificaciones");
      }

      if (Notification.permission !== "granted") {
        throw new Error("El permiso de notificaciones no está concedido");
      }

      if (!("serviceWorker" in navigator)) {
        throw new Error("El navegador no soporta Service Workers");
      }

      const registro = await navigator.serviceWorker.ready;

      await registro.showNotification(titulo, {
        body: cuerpo,
        icon: "/icons/Icon-192.png",
        tag: "desastres-" + Date.now(),
        data: { url: "/" }
      });

      console.log("Notificación de Windows solicitada correctamente");
      return true;
    } catch (e) {
      console.error("Error al mostrar la notificación:", e);
      throw e;
    }
  };
</script>

<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker
        .register('firebase-messaging-sw.js', {
          scope: '/firebase-cloud-messaging-push-scope',
        })
        .then((registration) => {
          console.log(
            '[FCM] Service worker registrado:',
            registration.scope
          );
        })
        .catch((error) => {
          console.error(
            '[FCM] Error registrando service worker:',
            error
          );
        });
    });
  }
</script>

</html>
