name: desastres_naturales
description: "Aplicación sobre desastres naturales."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.1.1
  marquee: ^2.3.0
  image_picker: ^1.2.4
  http: ^1.6.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.2
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Para hacer iconos automaticamente
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/AlertApp-Icon.png
    - assets/AlertApp-Icon-Transparent.png

# Configuración de los iconos de la aplicación
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/AlertApp-Icon-Transparent.png"
